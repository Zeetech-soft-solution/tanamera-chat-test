<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noviz AI Test Chat</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --me:#2f6feb; --me-text:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --panel:#171a21; --text:#e6e8eb; --muted:#9aa3ae; --line:#2a2f3a; --me:#3b82f6; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:820px; margin:0 auto; height:100vh; display:flex; flex-direction:column; padding:0 16px; }
  header { padding:14px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header b { font-size:16px; }
  header span { color:var(--muted); font-size:13px; }
  button { font:inherit; cursor:pointer; }
  #new { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:4px 10px; }
  #log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:90%; padding:10px 14px; border-radius:14px; background:var(--panel); border:1px solid var(--line); overflow-x:auto; }
  .msg.me { align-self:flex-end; background:var(--me); color:var(--me-text); border-color:var(--me); }
  .msg.ai { align-self:flex-start; }
  .msg table { border-collapse:collapse; margin:6px 0; font-size:13px; }
  .msg th, .msg td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  .steps { color:var(--muted); font-size:12px; margin-top:6px; }
  .err { color:#dc2626; }
  form { display:flex; gap:8px; padding:12px 0 16px; border-top:1px solid var(--line); }
  #q { flex:1; padding:10px 14px; border:1px solid var(--line); border-radius:22px; background:var(--panel); color:var(--text); font:inherit; }
  #send { width:42px; height:42px; border:none; border-radius:50%; background:var(--me); color:#fff; font-size:18px; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><b>Noviz AI</b><br><span id="who">connecting…</span></div>
    <button id="new" type="button">New chat</button>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Ask about your ERPNext…" autofocus>
    <button id="send" title="Send">➤</button>
  </form>
</div>
<script>
  const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
  let turnId = null;

  fetch("/me").then(r => r.json()).then(m => { document.getElementById("who").textContent = `${m.erp} · ${m.user}`; });

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  // Light markdown: bold, inline code, line breaks.
  const md = s => esc(s || "").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");

  function add(cls, html) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  document.getElementById("new").onclick = () => { turnId = null; log.innerHTML = ""; q.focus(); };

  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const prompt = q.value.trim();
    if (!prompt) return;
    add("me", esc(prompt));
    q.value = ""; send.disabled = true;
    const box = add("ai", '<span class="steps">thinking…</span>');
    try {
      const r = await fetch("/ask", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ prompt, previousTurnId: turnId }) });
      const d = await r.json();
      const steps = d.steps?.length ? `<div class="steps">${d.steps.map(esc).join(" · ")}</div>` : "";
      if (d.error) { box.innerHTML = `<span class="err">${esc(d.error)}</span>` + steps; }
      else { turnId = d.turnId; box.innerHTML = md(d.reply) + (d.html || "") + steps; }
    } catch (err) {
      box.innerHTML = `<span class="err">${esc(err.message)}</span>`;
    }
    send.disabled = false; q.focus();
    log.scrollTop = log.scrollHeight;
  };
</script>
</body>
</html>
