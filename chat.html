<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noviz AI Chat</title>
<!-- Noviz AI's result styles (tables, cards, charts). Keep unchanged. -->
<link rel="stylesheet" href="noviz-chat.css">
<!--
  Noviz AI chat inside your chat's wrapper and style.
  Your app keeps its own look (the CSS below); the chat itself is Noviz AI's:
  the page only talks to your server's /api routes (server.mjs + noviz.mjs).
  In your app: copy the <script> into your chat page, point API at your
  backend, and render answers inside your own message bubble.
-->
<style>
  /* ---- Your chat's style: change these ---- */
  :root {
    --bg:#1b1b1b; --panel:#2a2a2a; --panel-2:#232323; --line:#333; --text:#e8e8e8; --muted:#9a9a9a;
    --user:#2f5be8; --accent:#f0625d; --head:#3a2c2c;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .app { height:100%; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 20px; border-bottom:1px solid var(--line); }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:grid; place-items:center; flex:none; }
  .name { font-weight:600; }
  .badge { font-size:11px; background:#333; color:var(--muted); padding:2px 8px; border-radius:6px; margin-left:8px; }
  #newChat { margin-left:auto; background:#f2f2f2; color:#111; border:0; border-radius:16px; padding:6px 14px; font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:24px 16px 8px; }
  .row { max-width:760px; margin:0 auto 20px; }
  .row.user { display:flex; justify-content:flex-end; }
  .bubble-user { background:var(--user); color:#fff; padding:9px 14px; border-radius:14px; max-width:80%; white-space:pre-wrap; }
  .row.ai { display:flex; gap:10px; }
  .bubble-ai { flex:1; min-width:0; background:var(--panel); border-radius:12px; padding:12px 14px; overflow-x:auto; }
  .err { color:#f08a8a; }
  .thinking { color:var(--muted); }
  form { position:relative; max-width:760px; width:calc(100% - 32px); margin:0 auto 16px; background:var(--panel-2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; display:flex; align-items:flex-end; gap:8px; }
  #msg { flex:1; background:none; border:0; outline:0; color:var(--text); font:inherit; resize:none; height:44px; }
  #plus, #send { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:none; flex:none; }
  #send { background:#555; border:0; color:#fff; }
  #send:disabled { opacity:.5; }
  #menu { position:absolute; bottom:60px; left:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:200px; }
  #menu button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 10px; border-radius:6px; }
  #menu button:hover { background:#333; }

  /* ---- Noviz AI results in your style: noviz-chat.css stays unchanged,
     only its colour variables and the table look are set here ---- */
  .nz-root.nz-result {
    --nz-ink:var(--text); --nz-ink-2:#c4c4c4; --nz-muted:var(--muted);
    --nz-line:var(--line); --nz-line-strong:#4a4a4a; --nz-surface:var(--panel); --nz-soft:var(--head);
    --nz-brand:#ff8a85; --nz-brand-hover:#ffa9a5; --nz-brand-soft:#3a2c2c; --nz-highlight:#4a4026;
    --nz-shadow:none; --ink:var(--text); --ink-secondary:#c4c4c4;
    display:block; height:auto; margin-top:10px; padding:0; background:transparent; color:var(--text);
  }
  .nz-root.nz-result .erp-agent-table-scroll, .nz-root.nz-result .erp-agent-card { border:0; border-radius:0; background:transparent; }
  .nz-root.nz-result .erp-agent-table th { background:var(--head); color:var(--text); text-transform:none; letter-spacing:0; font-size:13px; font-weight:600; padding:11px 12px; }
  .nz-root.nz-result .erp-agent-table td { padding:11px 12px; border-bottom:1px solid var(--line); }
  .nz-root.nz-result .erp-agent-table tbody tr:last-child td { border-bottom:1px solid var(--line); }
  .nz-root.nz-result .erp-agent-table tbody tr:nth-child(even) td, .nz-root.nz-result .erp-agent-card-row:nth-child(even) { background:transparent; }
  .nz-root.nz-result .erp-agent-card-row { padding:11px 12px; border-top:0; border-bottom:1px solid var(--line); }
  .nz-root.nz-result .erp-agent-card-label { color:var(--muted); text-transform:none; letter-spacing:0; font-size:13px; font-weight:400; }
  .nz-root.nz-result a { color:var(--nz-brand); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">✦</div>
    <div><span class="name">ERP Assistant</span><span class="badge">Noviz AI</span></div>
    <button id="newChat" type="button">＋ New chat</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <button id="plus" type="button" title="More">＋</button>
    <div id="menu" hidden></div>
    <textarea id="msg" placeholder="Ask about your ERPNext…" autofocus></textarea>
    <button id="send" title="Send">↑</button>
  </form>
</div>
<script>
  // Your backend's chat API (server.mjs) and your ERPNext address, so PDF
  // links in answers open there (leave empty to hide them).
  const API = "api/";
  const ERP_LINK_BASE = "";

  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let lastTurnId = null, busy = false;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // The reply text: bold, code, bullets, line breaks.
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/^[-*] (.*)$/gm, "• $1").replace(/\n/g, "<br>");
  // Charts carry a few fixed light colours; map them to the dark style.
  const DARK = { "#1B1E1C": "#e8e8e8", "#6B7268": "#c4c4c4", "#9BA098": "#9a9a9a", "#F5F6F3": "#3a3a3a", "#FFFFFF": "#2a2a2a", "#E3E4DF": "#333333" };
  const dark = (h) => h.replace(/#1B1E1C|#6B7268|#9BA098|#F5F6F3|#FFFFFF|#E3E4DF/gi, (c) => DARK[c.toUpperCase()]);

  function add(cls, html) {
    const row = document.createElement("div");
    row.className = "row " + cls;
    row.innerHTML = cls === "user" ? `<div class="bubble-user">${html}</div>` : `<div class="avatar">✦</div><div class="bubble-ai">${html}</div>`;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  async function call(path, body) {
    const res = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  }

  // One question or next page: show thinking, then the answer.
  async function run(path, body, userText) {
    if (busy) return;
    busy = true; $("send").disabled = true;
    if (userText) add("user", esc(userText));
    const pending = add("ai", '<span class="thinking">Thinking…</span>');
    try {
      const r = await call(path, body);
      if (r.turnId) lastTurnId = r.turnId;
      pending.querySelector(".bubble-ai").innerHTML = md(r.reply || "") + (r.html ? `<div class="nz-root nz-result">${dark(r.html)}</div>` : "");
      pending.querySelectorAll('.nz-result a[href^="/"]').forEach((a) => {
        if (ERP_LINK_BASE) { a.href = ERP_LINK_BASE + a.getAttribute("href"); a.target = "_blank"; } else a.remove();
      });
    } catch (e) {
      pending.querySelector(".bubble-ai").innerHTML = `<span class="err">${esc(e.message)}</span>`;
    }
    busy = false; $("send").disabled = false; $("msg").focus();
    log.scrollTop = log.scrollHeight;
  }

  const send = (text, show = true) => run("send", { prompt: text, previous_turn_id: lastTurnId }, show ? text : null);

  // Buttons inside an answer: "Show more" goes straight to the next page;
  // record IDs and next steps ask their follow-up question.
  log.addEventListener("click", (e) => {
    const more = e.target.closest(".erp-agent-next-page[data-query]");
    if (more) {
      e.preventDefault();
      try { const q = JSON.parse(more.dataset.query); return run("next_page", { tool: q.tool, args: q.args }); } catch { return send(more.dataset.action); }
    }
    const btn = e.target.closest("button[data-action]");
    if (btn) { e.preventDefault(); send(btn.dataset.action, btn.dataset.hidden !== "1"); }
  });

  // The ＋ menu: Approvals, Mail ... as the relay offers them.
  call("chat_menu").then(({ items }) => {
    for (const it of items || []) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = it.label;
      b.onclick = () => {
        $("menu").hidden = true;
        if (it.prompt) return send(it.prompt);
        add("user", esc(it.label)); add("ai", md(it.empty || ""));
      };
      $("menu").appendChild(b);
    }
  }).catch(() => {});
  $("plus").onclick = () => { $("menu").hidden = !$("menu").hidden; };

  $("form").onsubmit = (e) => { e.preventDefault(); const t = $("msg").value.trim(); if (t) { $("msg").value = ""; send(t); } };
  $("msg").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
  $("newChat").onclick = () => { lastTurnId = null; log.innerHTML = ""; $("msg").focus(); };
</script>
</body>
</html>
